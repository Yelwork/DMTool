<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>玩家地圖</title>
    <script>
    // cache-bust: 20261108-ipad1 — clear old SW/cache, then install self-destructing SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      });
    }
    if (window.caches) {
      caches.keys().then(names => names.forEach(n => caches.delete(n)));
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: #eee; touch-action: manipulation; }
        .vision-circle {
            position: absolute;
            border-radius: 50%;
            background: transparent;
            border: 2px dashed rgba(255,255,255,0.5);
            box-sizing: border-box;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 15;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.85);
        }
        /* Full-size overlay layers must not steal taps from markers underneath */
        #areas-layer,
        #entities-layer,
        #fog-overlay,
        #vision-layer,
        #zones-layer,
        #tokens-layer {
            pointer-events: none;
        }
        .zone-marker {
            position: absolute;
            width: 18px; height: 18px;
            background: #22c55e;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 25;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(34, 197, 94, 0.35);
        }
        /* Expand hit target to ~44px for iPad without changing visual size */
        .zone-marker::after {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
        }
        .token {
            position: absolute;
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 3px solid white;
            transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold;
            color: white;
            z-index: 30;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .token::after {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
        }
        #player-map-container {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #player-map {
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">玩家地圖</h1>
        <div id="fb-status" class="text-sm mb-2">連線狀態：檢查中...</div>

        <div class="bg-gray-800 rounded p-4 mb-4">
            <label class="block mb-2">選擇角色：</label>
            <select id="char-select" class="bg-gray-700 text-white px-3 py-2 rounded w-full max-w-xs" onchange="selectCharacter()">
                <option value="">-- 選擇 --</option>
                <option value="tea">茶葉·布妮 (視覺 30呎)</option>
                <option value="celine">施琳·伊菲凱爾 (視覺 60呎)</option>
                <option value="benji">班吉 (視覺 30呎)</option>
                <option value="hank">漢克 (視覺 60呎)</option>
            </select>
        </div>

        <!-- Same 16:10 stage as DM map so contain-letterboxing (and %) stay aligned -->
        <div id="player-map-container" class="relative bg-gray-900 rounded overflow-hidden w-full" style="aspect-ratio: 16 / 10;">
            <div id="map-transform-layer" class="absolute inset-0" style="transform-origin: center center;">
                <div id="player-map" class="absolute inset-0" style="background-color: #1a1a2e; background-size: contain; background-repeat: no-repeat; background-position: center center;"></div>
                <div id="player-content-layer" class="absolute inset-0">
                    <div id="areas-layer" class="absolute inset-0"></div>
                    <div id="entities-layer" class="absolute inset-0"></div>
                    <div id="fog-overlay" class="absolute inset-0 pointer-events-none" style="z-index: 10; background: #000;"></div>
                    <div id="vision-layer" class="absolute inset-0 pointer-events-none" style="z-index: 15;"></div>
                    <div id="zones-layer" class="absolute inset-0" style="z-index: 25;"></div>
                    <div id="tokens-layer" class="absolute inset-0" style="z-index: 30;"></div>
                </div>
            </div>
        </div>

        <div class="mt-4 text-sm text-gray-400">
            <p>點擊綠色標記移動角色 · 圓形範圍為你的視覺</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDJcXYO2uj6OrFbi99THRcgeDLEWfJxEXI",
            authDomain: "dmtool-map.firebaseapp.com",
            databaseURL: "https://dmtool-map-default-rtdb.firebaseio.com",
            projectId: "dmtool-map",
            storageBucket: "dmtool-map.firebasestorage.app",
            messagingSenderId: "7240565044",
            appId: "1:7240565044:web:0089ad4813c5ec6ec92561"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const characters = {
            tea: { name: '茶葉·布妮', vision: 30, color: '#f59e0b' },
            celine: { name: '施琳·伊菲凱爾', vision: 60, color: '#8b5cf6' },
            benji: { name: '班吉', vision: 30, color: '#22c55e' },
            hank: { name: '漢克', vision: 60, color: '#3b82f6' }
        };

        let zones = [];
        let areas = [];
        let entities = [];
        let pixelsPerFiveFeet = 50;
        let isDragging = false;
        let currentChar = null;
        let currentZone = null;
        let myTokenId = null;
        let currentZoom = 2; // preset 200%
        let currentPanX = 0;
        let currentPanY = 0;

        function selectCharacter() {
            const id = document.getElementById('char-select').value;
            currentChar = id ? characters[id] : null;
            if (currentChar && !myTokenId) {
                const ref = db.ref('tokens').push();
                myTokenId = ref.key;
                ref.set({
                    characterId: id,
                    characterName: currentChar.name,
                    color: currentChar.color,
                    visionRange: currentChar.vision,
                    zoneId: null
                });
            }
            render();
        }

        function applyMapTransform() {
            const transformLayer = document.getElementById('map-transform-layer');
            if (!transformLayer) return;
            // Match DM: translate() scale() + origin center
            // screen = center + zoom * (local - center) + pan  (pan in screen px)
            transformLayer.style.transformOrigin = 'center center';
            transformLayer.style.transform =
                `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
        }

        function visionRadiusPx(zone) {
            const visionRange = (zone && zone.vision) || (currentChar && currentChar.vision) || 30;
            return (visionRange / 5) * pixelsPerFiveFeet;
        }

        function tokenPosition(zone) {
            if (!zone) return { x: 50, y: 50 };
            return { x: zone.x, y: zone.y };
        }

        function renderFog() {
            const fog = document.getElementById('fog-overlay');
            if (!fog) return;
            if (!currentChar || !currentZone) {
                fog.style.background = '#000';
                return;
            }
            const pos = tokenPosition(currentZone);
            const radius = visionRadiusPx(currentZone);
            // Fog lives inside the transform layer, so use local % and unscaled px
            fog.style.background =
                `radial-gradient(circle at ${pos.x}% ${pos.y}%, transparent 0px, transparent ${radius}px, black ${radius}px)`;
        }

        function isPointInPolygon(x, y, points) {
            if (!points || points.length < 3) return false;
            let inside = false;
            for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
                const xi = points[i].x, yi = points[i].y;
                const xj = points[j].x, yj = points[j].y;
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function screenToMapPercent(clientX, clientY) {
            const container = document.getElementById('player-map-container');
            const rect = container.getBoundingClientRect();
            // Use layout size for % so it matches CSS percentage positioning
            const w = container.clientWidth || rect.width;
            const h = container.clientHeight || rect.height;
            const centerX = w / 2;
            const centerY = h / 2;
            // Inverse of: screen = center + zoom * (local - center) + pan
            const relX = (clientX - rect.left - centerX - currentPanX) / currentZoom + centerX;
            const relY = (clientY - rect.top - centerY - currentPanY) / currentZoom + centerY;
            return {
                x: parseFloat((relX / w * 100).toFixed(2)),
                y: parseFloat((relY / h * 100).toFixed(2))
            };
        }

        function render() {
            const container = document.getElementById('player-map-container');
            const zonesLayer = document.getElementById('zones-layer');
            const tokensLayer = document.getElementById('tokens-layer');
            const visionLayer = document.getElementById('vision-layer');
            const areasLayer = document.getElementById('areas-layer');
            const entitiesLayer = document.getElementById('entities-layer');
            if (!container || !zonesLayer) return;

            zonesLayer.innerHTML = '';
            tokensLayer.innerHTML = '';
            visionLayer.innerHTML = '';
            areasLayer.innerHTML = '';
            if (entitiesLayer) entitiesLayer.innerHTML = '';

            const w = container.clientWidth;
            const h = container.clientHeight;

            areas.forEach(a => {
                if (!a.points || a.points.length < 3) return;
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('class', 'absolute inset-0 w-full h-full');
                svg.style.pointerEvents = 'none';
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                const pts = a.points.map(p => (p.x / 100 * w) + ',' + (p.y / 100 * h)).join(' ');
                polygon.setAttribute('points', pts);
                polygon.setAttribute('fill', 'rgba(34, 197, 94, 0.15)');
                polygon.setAttribute('stroke', '#22c55e');
                polygon.setAttribute('stroke-width', '2');
                svg.appendChild(polygon);
                areasLayer.appendChild(svg);
            });

            if (entitiesLayer) {
                entities.forEach(e => {
                    const el = document.createElement('div');
                    el.className = 'absolute rounded-full border-2 border-white flex items-center justify-center text-xs font-bold text-white';
                    el.style.width = '14px';
                    el.style.height = '14px';
                    el.style.left = e.x + '%';
                    el.style.top = e.y + '%';
                    el.style.transform = 'translate(-50%, -50%)';
                    el.style.background = e.type === 'monster' ? '#dc2626' : '#ca8a04';
                    el.textContent = e.name ? e.name[0] : '?';
                    el.title = e.name;
                    entitiesLayer.appendChild(el);
                });
            }

            zones.forEach(z => {
                if (z.playerVisible === false) return;
                const el = document.createElement('div');
                el.className = 'zone-marker';
                el.style.left = z.x + '%';
                el.style.top = z.y + '%';
                el.title = z.name;
                el.setAttribute('role', 'button');
                el.setAttribute('aria-label', z.name);
                // Prefer pointerup (mouse + iPad). Guard against duplicate touch→click.
                let armed = false;
                el.addEventListener('pointerdown', (ev) => {
                    armed = true;
                    ev.stopPropagation();
                });
                el.addEventListener('pointerup', (ev) => {
                    if (!armed) return;
                    armed = false;
                    ev.preventDefault();
                    ev.stopPropagation();
                    moveTo(z);
                });
                el.addEventListener('click', (ev) => {
                    // Fallback for browsers without PointerEvent on the marker path
                    if (window.PointerEvent) return;
                    ev.preventDefault();
                    ev.stopPropagation();
                    moveTo(z);
                });
                zonesLayer.appendChild(el);
            });

            if (currentChar && currentZone) {
                const pos = tokenPosition(currentZone);

                const token = document.createElement('div');
                token.className = 'token';
                token.style.left = pos.x + '%';
                token.style.top = pos.y + '%';
                token.style.background = currentChar.color;
                token.textContent = currentChar.name[0];
                tokensLayer.appendChild(token);

                // Vision circle uses the same local % coords as the token;
                // CSS transform on the shared layer keeps them aligned after zoom/pan.
                const radiusPx = visionRadiusPx(currentZone);
                const circle = document.createElement('div');
                circle.className = 'vision-circle';
                circle.style.left = pos.x + '%';
                circle.style.top = pos.y + '%';
                circle.style.width = (radiusPx * 2) + 'px';
                circle.style.height = (radiusPx * 2) + 'px';
                visionLayer.appendChild(circle);
            }

            renderFog();
        }

        function moveTo(zone) {
            if (!currentChar || !myTokenId) {
                alert('請先選擇角色');
                return;
            }
            currentZone = { ...zone, isFree: false };
            db.ref('tokens/' + myTokenId).update({
                zoneId: zone.id,
                freeX: null,
                freeY: null
            });
            render();
        }

        function eventPoint(e) {
            if (e.touches && e.touches[0]) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            if (e.changedTouches && e.changedTouches[0]) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function hitToken(clientX, clientY) {
            const token = document.querySelector('.token');
            if (!token) return false;
            const rect = token.getBoundingClientRect();
            // Extra padding so iPad finger can grab the token
            const pad = 18;
            return clientX >= rect.left - pad && clientX <= rect.right + pad &&
                clientY >= rect.top - pad && clientY <= rect.bottom + pad;
        }

        function startDrag(e) {
            if (!currentChar || !currentZone) return;
            // Ignore taps that started on a zone marker
            if (e.target && e.target.closest && e.target.closest('.zone-marker')) return;
            const pt = eventPoint(e);
            if (!hitToken(pt.x, pt.y)) return;
            isDragging = true;
            if (e.pointerId != null && e.currentTarget && e.currentTarget.setPointerCapture) {
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
            }
            if (e.cancelable) e.preventDefault();
        }

        function onDrag(e) {
            if (!isDragging || !currentChar) return;
            if (e.cancelable) e.preventDefault();
            const pt = eventPoint(e);
            const { x, y } = screenToMapPercent(pt.x, pt.y);
            const inArea = areas.some(a => isPointInPolygon(x, y, a.points));
            if (inArea) {
                // Update position without full re-render during drag (keeps touch target alive on iPad)
                currentZone = { ...currentZone, x, y, isFree: true };
                const token = document.querySelector('.token');
                if (token) {
                    token.style.left = x + '%';
                    token.style.top = y + '%';
                }
                const circle = document.querySelector('.vision-circle');
                if (circle) {
                    circle.style.left = x + '%';
                    circle.style.top = y + '%';
                }
                renderFog();
            }
        }

        function endDrag(e) {
            if (!isDragging) return;
            if (e && e.cancelable) e.preventDefault();
            if (currentZone && currentZone.isFree && myTokenId) {
                db.ref('tokens/' + myTokenId).update({
                    freeX: currentZone.x,
                    freeY: currentZone.y,
                    zoneId: currentZone.id || null
                });
            }
            isDragging = false;
        }

        const mapContainer = document.getElementById('player-map-container');
        // Pointer Events cover mouse + iPad touch in modern Safari
        mapContainer.addEventListener('pointerdown', startDrag);
        mapContainer.addEventListener('pointermove', onDrag);
        mapContainer.addEventListener('pointerup', endDrag);
        mapContainer.addEventListener('pointercancel', endDrag);
        mapContainer.addEventListener('pointerleave', endDrag);
        // Fallback touch listeners for older iPad Safari
        mapContainer.addEventListener('touchstart', startDrag, { passive: false });
        mapContainer.addEventListener('touchmove', onDrag, { passive: false });
        mapContainer.addEventListener('touchend', endDrag, { passive: false });
        mapContainer.addEventListener('touchcancel', endDrag, { passive: false });

        db.ref('.info/connected').on('value', snap => {
            const el = document.getElementById('fb-status');
            if (el) {
                el.textContent = snap.val() ? '🟢 Firebase 已連線' : '🔴 Firebase 未連線';
                el.style.color = snap.val() ? '#22c55e' : '#ef4444';
            }
        });

        db.ref('maps/phandalin').on('value', snap => {
            const data = snap.val();
            if (!data) return;
            const container = document.getElementById('player-map-container');
            const w = container.clientWidth || 1;
            const h = container.clientHeight || 1;

            if (data.fiveFeetWidthPct != null) {
                pixelsPerFiveFeet = (data.fiveFeetWidthPct / 100) * w;
            } else if (data.pixelsPerFiveFeet) {
                pixelsPerFiveFeet = data.pixelsPerFiveFeet;
            }
            if (data.imageUrl) {
                const mapEl = document.getElementById('player-map');
                mapEl.style.backgroundImage = "url('" + data.imageUrl + "')";
                mapEl.style.backgroundSize = 'contain';
                mapEl.style.backgroundRepeat = 'no-repeat';
                mapEl.style.backgroundPosition = 'center center';
            }
            currentZoom = data.zoom != null ? data.zoom : 2;
            // v2: translate()*scale(), pan as % of container. Ignore legacy pan pixels.
            if (data.transformVersion >= 2) {
                currentPanX = ((data.panXPct || 0) / 100) * w;
                currentPanY = ((data.panYPct || 0) / 100) * h;
            } else {
                currentPanX = 0;
                currentPanY = 0;
            }
            applyMapTransform();
            render();
        });

        window.addEventListener('resize', () => {
            db.ref('maps/phandalin').once('value').then(snap => {
                const data = snap.val();
                if (!data) return;
                const container = document.getElementById('player-map-container');
                const w = container.clientWidth || 1;
                const h = container.clientHeight || 1;
                if (data.transformVersion >= 2) {
                    currentPanX = ((data.panXPct || 0) / 100) * w;
                    currentPanY = ((data.panYPct || 0) / 100) * h;
                }
                if (data.fiveFeetWidthPct != null) {
                    pixelsPerFiveFeet = (data.fiveFeetWidthPct / 100) * w;
                }
                currentZoom = data.zoom != null ? data.zoom : 2;
                applyMapTransform();
                render();
            });
        });

        db.ref('zones').on('value', snap => {
            zones = [];
            snap.forEach(child => {
                zones.push({ id: child.key, ...child.val() });
            });
            if (currentZone && currentZone.id && !currentZone.isFree) {
                const updated = zones.find(z => z.id === currentZone.id);
                if (updated) currentZone = { ...updated, isFree: false };
            }
            render();
        });

        db.ref('areas').on('value', snap => {
            areas = [];
            snap.forEach(child => {
                areas.push({ id: child.key, ...child.val() });
            });
            render();
        });

        db.ref('entities').on('value', snap => {
            entities = [];
            snap.forEach(child => {
                entities.push({ id: child.key, ...child.val() });
            });
            render();
        });

        // Restore free position / zone when our token updates
        db.ref('tokens').on('value', snap => {
            if (!myTokenId) return;
            const t = snap.child(myTokenId).val();
            if (!t) return;
            if (t.freeX != null && t.freeY != null) {
                currentZone = {
                    ...(currentZone || {}),
                    id: t.zoneId || (currentZone && currentZone.id),
                    x: t.freeX,
                    y: t.freeY,
                    isFree: true,
                    vision: (currentZone && currentZone.vision) || t.visionRange
                };
            } else if (t.zoneId) {
                const z = zones.find(z => z.id === t.zoneId);
                if (z) currentZone = { ...z, isFree: false };
            }
            render();
        });
    </script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=20261108-ipad1')
          .then(reg => console.log('SW clear registered', reg.scope))
          .catch(err => console.log('SW clear failed', err));
      });
    }
    </script>
</body>
</html>
